[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[project]
name = "mff-demo-f16"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Quinn Thibeault", email = "qthibeault@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "aerobench",
    "numpy >=2.0",
    "pandas >=3.0",
]

[project.scripts]
mff-demo-f16 = "mff_demo_f16.__main__:main"

[tool.uv.sources]
aerobench = { git = "https://github.com/cpslab-asu/aerobenchvvpython" }
